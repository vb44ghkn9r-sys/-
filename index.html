<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Гаражик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0f1012;--card:#1a1b1e;--line:#2a2c31;--tx:#f3f1ec;--mut:#8b8d94;--ac:#f5a623;--ac2:#ffcc66;--ok:#3ecf8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Rounded",system-ui,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.coins{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px}
.coins small{font-size:15px;font-weight:600;color:var(--ac);margin-left:6px;letter-spacing:0}
.sold{color:var(--mut);font-size:14px;padding-bottom:4px}
.stage{position:relative;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0,#2a2b30,#151618);overflow:hidden}
#cv{display:block;width:100%;height:240px}
.tag{position:absolute;left:14px;top:12px;font-weight:700;font-size:15px}
.tag span{display:block;color:var(--mut);font-weight:500;font-size:12px}
.bar{height:14px;border-radius:9px;background:var(--card);margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#e08a00,var(--ac2));transition:width .15s}
.pct{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:12px}
.fix{width:100%;border:0;border-radius:20px;padding:20px;font-size:21px;font-weight:800;color:#2a1a00;background:linear-gradient(180deg,var(--ac2),var(--ac));box-shadow:0 6px 0 #b46f00;position:relative;transition:transform .06s,box-shadow .06s;touch-action:manipulation}
.fix:active{transform:translateY(5px);box-shadow:0 1px 0 #b46f00}
h3{font-size:17px;margin:26px 2px 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;font:inherit}
.row .ic{font-size:26px;width:44px;height:44px;border-radius:14px;background:#25272c;display:grid;place-items:center;flex:none}
.row b{display:block;font-size:16px}.row em{font-style:normal;color:var(--mut);font-size:13px}
.row .pr{margin-left:auto;font-weight:800;font-size:17px;color:var(--ac2);white-space:nowrap}
.row.off{opacity:.45}
.row.star .pr{color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(15,16,18,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:240px;border:0;border-radius:16px;padding:13px;font:700 15px inherit;font-family:inherit;color:var(--mut);background:var(--card)}
.tabs button.on{color:#2a1a00;background:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.slot.empty{border-style:dashed;color:var(--mut);display:grid;place-items:center;min-height:150px;font-size:13px}
.slot svg{width:100%;height:64px}
.slot b{display:block;margin-top:6px}
.slot button{margin-top:8px;width:100%;border:0;border-radius:12px;padding:9px;background:#25272c;color:var(--tx);font:600 13px inherit;font-family:inherit}
.hint{color:var(--mut);font-size:13px;margin:0 2px 12px}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;padding:20px;z-index:9}
.pop.show{display:grid}
.pop div{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:360px;text-align:center}
.pop svg{width:70%;height:90px}
.pop h2{margin:8px 0 4px}.pop p{color:var(--mut);margin:0 0 16px}
.pop button{width:100%;border:0;border-radius:16px;padding:15px;font:800 16px inherit;font-family:inherit;margin-top:8px}
.b1{background:var(--ac);color:#2a1a00}.b2{background:#25272c;color:var(--tx)}.b2:disabled{opacity:.4}
.fl{position:absolute;pointer-events:none;font-weight:800;color:#2a1a00;animation:up .7s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#2b2d33;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;transition:transform .25s;z-index:10}
.toast.show{transform:translate(-50%,0)}
.hide{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx);font-family:inherit}.chip.on{border-color:var(--ac);color:var(--ac2)}
.ln{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;color:var(--mut)}.ln span{width:52px}.ln .bar{flex:1;margin:0;height:12px}.ln .bar i{transition:none}
.slot .s{color:var(--mut);font-size:12px}.slot .r{display:flex;gap:6px}.slot.act{border-color:var(--ac)}
.tabs button{font-size:13px;font-weight:700;padding:12px 2px;max-width:none;font-family:inherit}.slot button{font-size:13px;font-weight:600}.pop button{font-size:16px;font-weight:800}.fix:disabled{opacity:.45}
.row em{display:block;margin-top:2px}
</style>
</head>
<body>
<div id="app">
 <div class="top"><div class="coins"><span id="coins">0</span><small>монет</small></div><div class="sold">продано: <b id="sold">0</b></div></div>

 <section id="tab-fix">
  <div class="stage"><canvas id="cv"></canvas><div class="tag"><span id="cname"></span></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pct"><span id="pct"></span><span id="auto"></span></div>
  <button class="fix" id="fix">🔧 Чинить</button>
  <h3>Улучшения</h3>
  <button class="row" id="up-tools"><div class="ic">🔧</div><div><b>Инструменты</b><em id="d-tools"></em></div><div class="pr" id="p-tools"></div></button>
  <button class="row" id="up-mech"><div class="ic">👷</div><div><b>Механики</b><em id="d-mech"></em></div><div class="pr" id="p-mech"></div></button>
  <button class="row star" id="up-star"><div class="ic">⭐</div><div><b>Мгновенный ремонт</b><em>Оплата Stars подключается позже</em></div><div class="pr">1 ⭐</div></button>
 </section>

 <section id="tab-cases" class="hide">
  <h3 style="margin-top:6px">Кейсы с машинами</h3>
  <p class="hint">Из кейса выпадает неисправная машина: чем выше ★, тем она реже и дороже. Её можно починить и продать или отправить в гонку.</p>
  <div id="cases"></div>
 </section>

 <section id="tab-race" class="hide">
  <h3 style="margin-top:6px">Гонка</h3>
  <p class="hint">Выбери отремонтированную машину и жми «Газ!» как можно чаще. Приз зависит от места и класса машины.</p>
  <div class="chips" id="rcars"></div>
  <div id="lanes"></div>
  <button class="fix" id="go" style="margin-top:12px">🏁 Старт</button>
 </section>

 <section id="tab-garage" class="hide">
  <h3 style="margin-top:6px">Мой гараж</h3>
  <p class="hint">Места: <b id="gcount"></b></p>
  <div class="grid" id="ggrid"></div>
 </section>
</div>

<div class="tabs"><button id="t1" class="on">🔧 Ремонт</button><button id="t2">🎁 Кейсы</button><button id="t3">🏁 Гонка</button><button id="t4">🚗 Гараж</button></div>
<div class="pop" id="pop"><div>
 <div id="pcar"></div><h2 id="ptitle"></h2><p id="ptext"></p>
 <button class="b1" id="psell"></button><button class="b2" id="psave"></button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0f1012'); tg.setBackgroundColor('#0f1012'); } catch(e){} }

/* ---------- данные: категории -> машины [название, класс 1-5] ---------- */
const CATS = [
 {n:'Легковые', ic:'🚘', p:600,  d:[2.6,.7,1.3,.6],  c:[['Хёндэ Солярис',1],['Лада Веста',1],['Тойота Камри',2],['Мерседес E-класс',3],['БМВ M5',4],['Майбах S-класс',5]]},
 {n:'Кроссоверы', ic:'🚙', p:900, d:[2.5,.95,1.4,.65], c:[['Рено Дастер',1],['Киа Спортейдж',2],['БМВ X5',3],['Рэндж Ровер',4],['Мерседес Гелик',5]]},
 {n:'Универсалы', ic:'🚐', p:700, d:[2.9,.75,1.9,.6],  c:[['Лада Веста SW',1],['Шкода Октавия Комби',2],['Вольво V60',3],['Ауди RS6 Avant',4],['БМВ M5 Touring',5]]},
 {n:'Хэтчбеки', ic:'🚗', p:500,   d:[2.2,.7,1.2,.65],  c:[['Лада Калина',1],['Фольксваген Гольф',2],['Хонда Сивик Type R',3],['Мерседес A45 AMG',4],['Тойота GR Yaris',5]]},
 {n:'Купе и спорткары', ic:'🏎️', p:1200, d:[2.6,.55,1,.45], c:[['Мазда MX-5',1],['Форд Мустанг',2],['Порше 911',3],['Ниссан GT-R',4],['Ламборгини Хуракан',5]]}
];
const CARS = [];
CATS.forEach((k, ci) => k.c.forEach(x => CARS.push({n:x[0], t:x[1], cat:ci, hp:50*x[1], cph:2*x[1], val:300*x[1]*x[1], col:'hsl(' + (CARS.length*53 % 360) + ',55%,48%)'})));
const W = [45, 30, 15, 8, 2], SLOTS = 8, KEY = 'garazhik_v3';
const def = {coins:1000, sold:0, power:1, auto:0, garage:[{id:1, car:0, prog:0}], active:1};
let S = JSON.parse(JSON.stringify(def));
try {
  const now = localStorage.getItem(KEY), old = JSON.parse(localStorage.getItem('garazhik_v2') || 'null');
  if (now) Object.assign(S, JSON.parse(now));
  else if (old) { ['coins','sold','power','auto'].forEach(k => { if (typeof old[k] === 'number') S[k] = old[k]; }); localStorage.setItem(KEY, JSON.stringify(S)); }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('ru-RU');
const toolsPrice = () => 60 * Math.pow(2, S.power);
const mechPrice  = () => Math.round(480 * Math.pow(1.8, S.auto));
const cur = () => S.garage.find(g => g.id === S.active);
const isDone = g => g.prog >= CARS[g.car].hp;
const stars = t => '★'.repeat(t);
function svgCar(col){
  return `<svg viewBox="0 0 120 60"><path d="M10 40 L14 28 Q16 24 22 24 L38 24 L46 12 Q48 10 52 10 L80 10 Q84 10 86 13 L94 24 L104 26 Q110 28 110 34 L110 42 Z" fill="${col}"/><path d="M50 14 L44 24 L72 24 L72 14 Z M77 14 L77 24 L90 24 L84 14 Z" fill="#0f1012" opacity=".75"/><circle cx="34" cy="44" r="10" fill="#111"/><circle cx="34" cy="44" r="4" fill="#555"/><circle cx="88" cy="44" r="10" fill="#111"/><circle cx="88" cy="44" r="4" fill="#555"/></svg>`;
}
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1900); }
function buzz(k){ try { tg.HapticFeedback.impactOccurred(k || 'light'); } catch(e){} }

/* ---------- 3D ---------- */
let scene, cam, ren, car, body, cab, bodyMat, bump = 0, ok3d = false;
function init3d(){
  try {
    const cv = $('cv'), w = cv.clientWidth || 360, h = 240;
    ren = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
    ren.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); ren.setSize(w, h, false);
    scene = new THREE.Scene();
    cam = new THREE.PerspectiveCamera(38, w/h, .1, 50); cam.position.set(0, 2.8, 7); cam.lookAt(0, .5, 0);
    scene.add(new THREE.AmbientLight(0xffffff, .65));
    const dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(3, 6, 4); scene.add(dl);
    const plat = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, .2, 48), new THREE.MeshLambertMaterial({color:0x3a3c42}));
    plat.position.y = -.1; scene.add(plat);
    car = new THREE.Group(); bodyMat = new THREE.MeshLambertMaterial({color:0x888888});
    body = new THREE.Mesh(new THREE.BoxGeometry(2.6, .7, 1.25), bodyMat); car.add(body);
    cab = new THREE.Mesh(new THREE.BoxGeometry(1.3, .6, 1.05), new THREE.MeshLambertMaterial({color:0x14181f})); car.add(cab);
    const wm = new THREE.MeshLambertMaterial({color:0x111111}), wg = new THREE.CylinderGeometry(.42, .42, .3, 24);
    [[-.85,.64],[.85,.64],[-.85,-.64],[.85,-.64]].forEach(p => { const x = new THREE.Mesh(wg, wm); x.rotation.x = Math.PI/2; x.position.set(p[0], .42, p[1]); car.add(x); });
    scene.add(car); ok3d = true; apply3d(); loop();
  } catch(e){ ok3d = false; }
}
function apply3d(){
  if (!ok3d) return;
  const g = cur(); car.visible = !!g; if (!g) return;
  const d = CATS[CARS[g.car].cat].d;
  body.scale.set(d[0]/2.6, d[1]/.7, 1); body.position.y = .35 + d[1]/2;
  cab.scale.set(d[2]/1.3, d[3]/.6, 1); cab.position.set(-.15, .35 + d[1] + d[3]/2 - .02, 0);
}
function loop(){
  requestAnimationFrame(loop);
  const g = cur(); if (g) {
    car.rotation.y += .007; bump *= .86; const s = 1 + bump; car.scale.set(s, s, s);
    const c = CARS[g.car]; bodyMat.color.set(0x6a625e).lerp(new THREE.Color(c.col), Math.min(g.prog / c.hp, 1));
  }
  ren.render(scene, cam);
}

/* ---------- окно ---------- */
function P(o){
  $('pcar').innerHTML = o.svg; $('ptitle').textContent = o.t; $('ptext').textContent = o.x || '';
  const a = $('psell'), b = $('psave');
  a.textContent = o.a ? o.a[0] : ''; a.onclick = o.a ? o.a[1] : null;
  b.textContent = o.b ? o.b[0] : ''; b.onclick = o.b ? o.b[1] : null; b.disabled = !!(o.b && o.b[2]);
  a.style.display = o.a ? '' : 'none'; b.style.display = o.b ? '' : 'none';
  $('pop').classList.add('show');
}
function closeP(){ $('pop').classList.remove('show'); save(); render(); }

/* ---------- ремонт (стоит монет) ---------- */
function repair(n){
  const g = cur(); if (!g || isDone(g)) return false;
  const c = CARS[g.car]; let h = Math.min(n, c.hp - g.prog);
  if (S.coins < h * c.cph) h = Math.floor(S.coins / c.cph);
  if (h < 1) return false;
  S.coins -= h * c.cph; g.prog += h;
  if (isDone(g)) { buzz('heavy'); P({svg:svgCar(c.col), t:c.n + ' отремонтирована', x:'Продай или оставь для гонок.',
    a:['Продать за ' + fmt(c.val), () => { sell(g.id); closeP(); }], b:['Оставить в гараже', () => { S.active = null; closeP(); }]}); }
  return true;
}
function floatText(txt, e){
  const b = $('fix').getBoundingClientRect(), el = document.createElement('div'); el.className = 'fl'; el.textContent = txt;
  el.style.cssText = `position:fixed;left:${(e && e.clientX) || b.left + b.width/2}px;top:${(e && e.clientY) || b.top}px`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 700);
}
$('fix').addEventListener('click', e => {
  if (!repair(S.power)) return toast('Не хватает монет — заработай в гонке');
  bump = .07; buzz('light'); floatText('🔧 +' + S.power, e); save(); render();
});
$('up-tools').addEventListener('click', () => { const p = toolsPrice(); if (S.coins < p) return toast('Не хватает монет'); S.coins -= p; S.power++; buzz('medium'); save(); render(); });
$('up-mech').addEventListener('click', () => { const p = mechPrice(); if (S.coins < p) return toast('Не хватает монет'); S.coins -= p; S.auto++; buzz('medium'); save(); render(); });
$('up-star').addEventListener('click', () => toast('Оплата Stars подключается позже'));

function sell(id){
  const i = S.garage.findIndex(g => g.id === id); if (i < 0) return;
  const g = S.garage[i], c = CARS[g.car], v = isDone(g) ? c.val : Math.round(c.val * .1);
  S.coins += v; S.sold++; S.garage.splice(i, 1); if (S.active === id) S.active = null;
  toast('Продано за ' + fmt(v)); save();
}

/* ---------- кейсы ---------- */
function openCase(ci){
  const k = CATS[ci];
  if (S.coins < k.p) return toast('Не хватает монет');
  if (S.garage.length >= SLOTS) return toast('Гараж полон — продай машину');
  S.coins -= k.p;
  let r = Math.random() * 100, t = 1; for (let i = 0; i < 5; i++) { if (r < W[i]) { t = i + 1; break; } r -= W[i]; }
  const pool = CARS.map((c, i) => i).filter(i => CARS[i].cat === ci && CARS[i].t === t);
  const idx = pool[Math.floor(Math.random() * pool.length)], all = CARS.map((c, i) => i).filter(i => CARS[i].cat === ci);
  const g = {id:Date.now(), car:idx, prog:0}; S.garage.push(g); if (!cur()) S.active = g.id; save(); render(); buzz('medium');
  let n = 0; const iv = setInterval(() => {
    P({svg:svgCar(CARS[all[Math.floor(Math.random() * all.length)]].col), t:'Открываем кейс…'});
    if (++n > 12) { clearInterval(iv); const c = CARS[idx]; buzz('heavy');
      P({svg:svgCar(c.col), t:c.n + ' ' + stars(c.t), x:'Неисправна. Ремонт ' + fmt(c.hp * c.cph) + ' монет, после ремонта стоит ' + fmt(c.val) + '.',
        a:['В гараж', closeP], b:['Открыть ещё за ' + fmt(k.p), () => { closeP(); openCase(ci); }, S.coins < k.p || S.garage.length >= SLOTS]}); }
  }, 100);
}
$('cases').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) openCase(+b.dataset.c); });

/* ---------- гонка ---------- */
const R = {car:null, run:false, pos:[0,0,0,0], boost:0, iv:0};
function lanes(){ $('lanes').innerHTML = ['Ты','Соперник 1','Соперник 2','Соперник 3'].map((n, i) => `<div class="ln"><span>${i ? 'Соп. ' + i : n}</span><div class="bar"><i style="width:${R.pos[i]}%"></i></div></div>`).join(''); }
function startRace(){
  const g = S.garage.find(x => x.id === R.car);
  if (!g || !isDone(g)) return toast('Выбери отремонтированную машину');
  R.run = true; R.pos = [0,0,0,0]; R.boost = 0; R.t = CARS[g.car].t; $('go').textContent = '🔥 Газ!'; render();
  R.iv = setInterval(() => {
    const p = R.pos; p[0] += (.3 + .12 * R.t + R.boost) * .5; R.boost *= .9;
    for (let i = 1; i < 4; i++) p[i] += (.55 + .08 * R.t + Math.random() * .5 + i * .03) * .5;
    lanes();
    if (p.some(v => v >= 100)) {
      clearInterval(R.iv); R.run = false; $('go').textContent = '🏁 Старт';
      const place = 1 + p.slice(1).filter(v => v > p[0]).length, prize = Math.round((120 * R.t + 80) * [1, .5, .25, .1][place - 1]);
      S.coins += prize; save(); toast(place + ' место: +' + fmt(prize) + ' монет'); render();
    }
  }, 50);
}
$('go').addEventListener('click', () => { if (!R.run) startRace(); else { R.boost = Math.min(R.boost + .5, 3.5); buzz('light'); } });
$('rcars').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b && !R.run) { R.car = +b.dataset.r; render(); } });

/* ---------- гараж ---------- */
$('ggrid').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const id = +b.dataset.id;
  if (b.dataset.act === 'fix') { S.active = id; save(); render(); tab(1); }
  if (b.dataset.act === 'race') { R.car = id; render(); tab(3); }
  if (b.dataset.act === 'sell') { sell(id); render(); }
});

/* ---------- интерфейс ---------- */
function render(){
  const g = cur(), c = g && CARS[g.car];
  $('coins').textContent = fmt(S.coins); $('sold').textContent = S.sold;
  $('cname').innerHTML = c ? c.n + ' ' + stars(c.t) + '<span>' + (isDone(g) ? 'готова — продай или в гонку' : 'ремонт: ' + c.cph + ' монет за ед.') + '</span>' : 'Нет машины в работе<span>выбери в гараже или открой кейс</span>';
  const pr = c ? Math.min(100, Math.floor(g.prog / c.hp * 100)) : 0;
  $('bar').style.width = pr + '%'; $('pct').textContent = c ? pr + '% отремонтировано' : '';
  $('auto').textContent = S.auto ? 'механики: ' + S.auto + ' ед/сек' : '';
  $('fix').disabled = !c || isDone(g);
  $('fix').textContent = '🔧 Чинить (+' + S.power + (c ? ', −' + fmt(S.power * c.cph) : '') + ')';
  $('d-tools').textContent = '+1 к ремонту за клик (сейчас ' + S.power + ')'; $('p-tools').textContent = fmt(toolsPrice());
  $('d-mech').textContent = 'Чинят сами: ' + S.auto + ' ед/сек'; $('p-mech').textContent = fmt(mechPrice());
  $('up-tools').classList.toggle('off', S.coins < toolsPrice()); $('up-mech').classList.toggle('off', S.coins < mechPrice());
  $('cases').innerHTML = CATS.map((k, i) => `<button class="row ${S.coins < k.p ? 'off' : ''}" data-c="${i}"><div class="ic">${k.ic}</div><div><b>${k.n}</b><em>${k.c.map(x => x[0]).join(' · ')}</em></div><div class="pr">${fmt(k.p)}</div></button>`).join('');
  const rd = S.garage.filter(isDone); if (!rd.find(x => x.id === R.car)) R.car = rd.length ? rd[0].id : null;
  $('rcars').innerHTML = rd.length ? rd.map(x => `<button class="chip ${x.id === R.car ? 'on' : ''}" data-r="${x.id}">${CARS[x.car].n} ${stars(CARS[x.car].t)}</button>`).join('') : '<span class="hint">Пока нет отремонтированных машин — почини одну в гараже.</span>';
  if (!R.run) lanes();
  $('gcount').textContent = S.garage.length + ' / ' + SLOTS;
  let h = S.garage.map(x => { const k = CARS[x.car], d = isDone(x), v = d ? k.val : Math.round(k.val * .1);
    return `<div class="slot ${x.id === S.active ? 'act' : ''}">${svgCar(k.col)}<b>${k.n}</b><div class="s">${CATS[k.cat].n} · ${stars(k.t)} · ${d ? 'на ходу' : Math.floor(x.prog / k.hp * 100) + '%'}</div><div class="r"><button data-act="${d ? 'race' : 'fix'}" data-id="${x.id}">${d ? 'В гонку' : 'Чинить'}</button><button data-act="sell" data-id="${x.id}">${fmt(v)} 🪙</button></div></div>`; }).join('');
  for (let i = S.garage.length; i < SLOTS; i++) h += '<div class="slot empty">Свободное место</div>';
  $('ggrid').innerHTML = h; apply3d();
}
function tab(n){
  ['tab-fix','tab-cases','tab-race','tab-garage'].forEach((id, i) => { $(id).classList.toggle('hide', i + 1 !== n); $('t' + (i + 1)).classList.toggle('on', i + 1 === n); });
  window.scrollTo(0, 0);
}
[1,2,3,4].forEach(n => $('t' + n).addEventListener('click', () => tab(n)));
setInterval(() => { if (S.auto > 0 && repair(S.auto)) { save(); render(); } }, 1000);
render(); init3d();
</script>
</body>
