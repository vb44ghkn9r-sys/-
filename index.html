<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Гараж-тайкун</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceae4;--card:#fff;--text:#1c1b18;--muted:#77726a;--line:#ddd8cc;--acc:#f5a623;--ok:#2fb55a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131313;--card:#1f1f1f;--text:#f2eee5;--muted:#9a958a;--line:#2d2d2d}}
:root[data-theme="dark"]{--bg:#131313;--card:#1f1f1f;--text:#f2eee5;--muted:#9a958a;--line:#2d2d2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden}
.w{max-width:440px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.top b{font-size:30px}.top span{color:var(--muted);font-size:13px}
.view{position:relative;height:250px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:20px;pointer-events:none}
.bar{height:10px;background:var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .1s}
.main{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--acc);color:#241a05;cursor:pointer;margin-bottom:10px}
.main:disabled{opacity:.4}
.main.sell{background:var(--ok);color:#fff}
h3{margin:14px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;text-align:left;cursor:pointer}
.r small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.r .p{font-weight:700;white-space:nowrap;margin-left:10px}
.r:disabled{opacity:.45;cursor:default}
.r:not(:disabled) .p{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.note{text-align:center;color:var(--muted);font-size:12px;margin:14px 0}
</style>
</head>
<body>
<div class="w">
<div class="top"><b id="coins">0</b><span>монет · продано: <span id="sold">0</span></span></div>
<div class="view" id="view"><canvas id="cv"></canvas><div class="hint" id="hint">Выбери машину внизу и купи её</div></div>
<div class="bar"><i id="bar"></i></div>
<button class="main" id="main"></button>
<h3>Улучшения</h3>
<button class="r" id="uT"><div>🔧 Инструменты<small id="uTs"></small></div><div class="p" id="uTp"></div></button>
<button class="r" id="uW"><div>👷 Механики<small id="uWs"></small></div><div class="p" id="uWp"></div></button>
<button class="r" id="uS"><div>⭐ Мгновенный ремонт<small>Оплата Stars подключается позже</small></div><div class="p">1 ⭐</div></button>
<h3>Купить машину</h3>
<div id="shop"></div>
<div class="note">Монеты внутриигровые, вывести их нельзя.</div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cars=[
{n:"Жигули",b:50,s:130,w:20,c:0xc0392b,l:1,h:.45,u:0},
{n:"Седан",b:300,s:720,w:50,c:0x2980b9,l:1.15,h:.5,u:3},
{n:"Купе",b:1500,s:3600,w:120,c:0x8e44ad,l:1.2,h:.42,u:8},
{n:"Спорткар",b:8000,s:20500,w:300,c:0xf39c12,l:1.3,h:.34,u:15},
{n:"911 GT3 RS",b:40000,s:105000,w:800,c:0xf4f4f6,l:1.4,h:.28,u:25}];
var K="garage_v1",s={coins:150,cur:-1,prog:0,power:1,wk:0,sold:0};
try{var o=JSON.parse(localStorage.getItem(K)||"null");if(o)for(var k in s)if(typeof o[k]==="number")s[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
var tg=null;
try{var sc=document.createElement("script");sc.src="https://telegram.org/js/telegram-web-app.js";
sc.onload=function(){try{tg=window.Telegram.WebApp;tg.ready();tg.expand()}catch(e){}};sc.onerror=function(){};document.head.appendChild(sc)}catch(e){}
function buzz(){try{tg&&tg.HapticFeedback.impactOccurred("light")}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.opacity=0},2200)}
function f(n){return Math.floor(n).toLocaleString("ru-RU")}
function tc(){return 60*s.power*s.power}
function wc(){return 120*(s.wk+1)*(s.wk+1)}
/* 3D */
var T=window.THREE,R,sc3,cam,grp,bodyM,bump=0,rust,tgt,pre=false;
function init3(){
if(!T){return}
try{
var cv=$("cv"),v=$("view");
R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
var W=v.clientWidth,H=v.clientHeight;R.setSize(W,H,false);
sc3=new T.Scene();cam=new T.PerspectiveCamera(40,W/H,.1,50);cam.position.set(3.3,1.9,3.9);cam.lookAt(0,.35,0);
sc3.add(new T.AmbientLight(0xffffff,.65));var d=new T.DirectionalLight(0xffffff,.9);d.position.set(3,6,4);sc3.add(d);
var pl=new T.Mesh(new T.CylinderGeometry(2.4,2.4,.1,40),new T.MeshStandardMaterial({color:0x555555}));pl.position.y=-.05;sc3.add(pl);
rust=new T.Color(0x6b4a2f);tgt=new T.Color(0xffffff);
loop()}catch(e){R=null}}
function build(i){
if(!R)return;
if(grp)sc3.remove(grp);WH=[];
var c=cars[i];grp=new T.Group();
bodyM=new T.MeshStandardMaterial({color:0x6b4a2f,metalness:.4,roughness:.5});
tgt=new T.Color(c.c);if(i===4){car911();sc3.add(grp);paint();return}
var len=2.2*c.l,bh=c.h,by=.33+bh/2;
var b=new T.Mesh(new T.BoxGeometry(len,bh,1),bodyM);b.position.y=by;grp.add(b);
var ch=bh*.85,cab=new T.Mesh(new T.BoxGeometry(len*.5,ch,.9),new T.MeshStandardMaterial({color:0x1d2b3a,metalness:.6,roughness:.2}));
cab.position.set(-.1,by+bh/2+ch/2,0);grp.add(cab);
var wm=new T.MeshStandardMaterial({color:0x151515}),wg=new T.CylinderGeometry(.28,.28,.22,20);
[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(p){var w=new T.Mesh(wg,wm);w.rotation.x=Math.PI/2;w.position.set(p[0]*len*.32,.28,p[1]*.52);grp.add(w)});
sc3.add(grp);paint()}
var WH=[];
function car911(){
var sh=new T.Shape(),P=[[-1.45,.25],[-1.47,.58],[-1.2,.72],[-.7,.92],[-.25,1.04],[.2,1],[.6,.74],[1.2,.6],[1.42,.46],[1.45,.25]];
sh.moveTo(P[0][0],P[0][1]);for(var i=1;i<P.length;i++)sh.lineTo(P[i][0],P[i][1]);
var g=new T.ExtrudeGeometry(sh,{depth:1.1,bevelEnabled:false});g.translate(0,0,-.55);grp.add(new T.Mesh(g,bodyM));
var gs=new T.Shape(),Q=[[-.8,.78],[-.3,.97],[.18,.93],[.5,.76]];
gs.moveTo(Q[0][0],Q[0][1]);for(var j=1;j<Q.length;j++)gs.lineTo(Q[j][0],Q[j][1]);
var gg=new T.ExtrudeGeometry(gs,{depth:1.14,bevelEnabled:false});gg.translate(0,0,-.57);
grp.add(new T.Mesh(gg,new T.MeshStandardMaterial({color:0x14202c,metalness:.7,roughness:.15})));
var dk=new T.MeshStandardMaterial({color:0x111111,metalness:.3,roughness:.5});
var wg=new T.Mesh(new T.BoxGeometry(.5,.05,1.2),dk);wg.position.set(-1.42,1,0);grp.add(wg);
[-.42,.42].forEach(function(z){var p=new T.Mesh(new T.BoxGeometry(.06,.3,.05),dk);p.position.set(-1.38,.85,z);grp.add(p);
var e=new T.Mesh(new T.BoxGeometry(.5,.14,.03),dk);e.position.set(-1.42,1.02,z*1.4);grp.add(e)});
var sp=new T.Mesh(new T.BoxGeometry(.3,.04,1.15),dk);sp.position.set(1.45,.24,0);grp.add(sp);
var hm=new T.MeshStandardMaterial({color:0xffffee,emissive:0xffffcc});
[-.4,.4].forEach(function(z){var h=new T.Mesh(new T.SphereGeometry(.09,12,8),hm);h.scale.x=.6;h.position.set(1.4,.5,z);grp.add(h)});
var tl=new T.Mesh(new T.BoxGeometry(.03,.07,.9),new T.MeshStandardMaterial({color:0xff1111,emissive:0xcc0000}));tl.position.set(-1.47,.6,0);grp.add(tl);
var tm=new T.MeshStandardMaterial({color:0x141414}),rm=new T.MeshStandardMaterial({color:0xb8b8c0,metalness:.8,roughness:.3});
[[.95,1],[.95,-1],[-.95,1],[-.95,-1]].forEach(function(p){
var w=new T.Group();w.position.set(p[0],.33,p[1]*.58);
var t=new T.Mesh(new T.CylinderGeometry(.33,.33,.26,24),tm);t.rotation.x=Math.PI/2;
var r=new T.Mesh(new T.CylinderGeometry(.21,.21,.27,12),rm);r.rotation.x=Math.PI/2;
w.add(t);w.add(r);grp.add(w);WH.push(w)});
var cn=document.createElement("canvas");cn.width=512;cn.height=128;var cx=cn.getContext("2d");
cx.font="italic 800 84px Arial, sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle="#d5001c";cx.fillText("Максим",256,64);
var tmat=new T.MeshBasicMaterial({map:new T.CanvasTexture(cn),transparent:true});
[1,-1].forEach(function(z){var m=new T.Mesh(new T.PlaneGeometry(1,.25),tmat);m.position.set(-.05,.45,z*.556);if(z<0)m.rotation.y=Math.PI;grp.add(m)})}
function paint(){if(!bodyM||s.cur<0)return;var p=s.prog/cars[s.cur].w;bodyM.color.copy(rust).lerp(tgt,Math.min(1,p));bodyM.emissive.setHex(p>=1?0x222222:0)}
function loop(){requestAnimationFrame(loop);if(grp){grp.rotation.y+=.008;WH.forEach(function(w){w.rotation.z-=.02+bump*3});var sc=1+bump;grp.scale.set(sc,sc,sc);bump*=.85}R.render(sc3,cam)}
/* game */
function ui(){
$("coins").textContent=f(s.coins);$("sold").textContent=s.sold;
var has=s.cur>=0,c=has?cars[s.cur]:null,done=has&&s.prog>=c.w;
$("bar").style.width=has?(100*s.prog/c.w)+"%":"0";
$("hint").style.display=(has&&R)?"none":"flex";
$("hint").textContent=has?(c.n+": "+Math.floor(s.prog)+"/"+c.w):"Выбери машину внизу и купи её";
var m=$("main");m.disabled=!has;m.className="main"+(done?" sell":"");
m.textContent=!has?"Сначала купи машину":done?"💰 Продать за "+f(c.s):"🔧 Чинить (+"+s.power+")";
$("uTs").textContent="+1 к ремонту за клик (сейчас "+s.power+")";$("uTp").textContent=f(tc());$("uT").disabled=s.coins<tc();
$("uWs").textContent="Чинят сами: "+s.wk+" ед/сек";$("uWp").textContent=f(wc());$("uW").disabled=s.coins<wc();
var h="";cars.forEach(function(c,i){var lock=s.sold<c.u;
h+='<button class="r" data-i="'+i+'"'+((lock||has||s.coins<c.b)?" disabled":"")+'><div>🚗 '+c.n+'<small>'+(lock?"Нужно продать машин: "+c.u:"Продажа после ремонта: "+f(c.s))+'</small></div><div class="p">'+f(c.b)+'</div></button>'});
$("shop").innerHTML=h}
function fix(n){if(s.cur<0)return;var c=cars[s.cur];if(s.prog>=c.w)return;s.prog=Math.min(c.w,s.prog+n);bump=.06;paint();buzz();save();ui()}
$("main").onclick=function(){
if(s.cur<0)return;var c=cars[s.cur];
if(s.prog>=c.w){s.coins+=c.s;s.sold++;s.cur=-1;s.prog=0;if(grp){sc3.remove(grp);grp=null}buzz();save();ui()}else fix(s.power)};
$("view").addEventListener("pointerdown",function(){fix(s.power)});
$("uT").onclick=function(){if(s.coins>=tc()){s.coins-=tc();s.power++;save();ui()}};
$("uW").onclick=function(){if(s.coins>=wc()){s.coins-=wc();s.wk++;save();ui()}};
$("uS").onclick=function(){toast("Оплата Stars заработает после подключения бота")};
$("shop").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.disabled)return;
var i=+b.dataset.i,c=cars[i];if(s.cur>=0||s.coins<c.b||s.sold<c.u)return;
s.coins-=c.b;s.cur=i;s.prog=0;build(i);buzz();save();ui()});
setInterval(function(){if(s.wk>0&&s.cur>=0&&s.prog<cars[s.cur].w){s.prog=Math.min(cars[s.cur].w,s.prog+s.wk*.25);paint();ui()}},250);
setInterval(save,5000);
init3();if(s.cur>=0)build(s.cur);ui();
})();
</script>
</body>
</html>
